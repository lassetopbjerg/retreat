# Pages CMS configuration — https://pagescms.org
# Log in at https://app.pagescms.org with GitHub and open this repo.

content:
  - name: retreat
    label: Retreat page
    type: file
    path: content.json
    format: json
    fields:
      # --- Sign-up -------------------------------------------------
      - name: status
        label: Sign-up status
        description: Decides the main button on the page.
        type: select
        default: soon
        options:
          values:
            - value: soon
              label: Not open yet → "Get notified"
            - value: open
              label: Open → "Reserve a place"
            - value: full
              label: Full → "Join the waitlist"
      - name: dates
        label: Dates
        description: e.g. "5–9 July 2027". Leave empty to show "Announced soon".
        type: string
      - name: places_total
        label: Total places
        type: number
        default: 10
      - name: places_taken
        label: Places taken
        description: When this reaches the total, the button switches to "Join the waitlist" by itself.
        type: number
        default: 0
      - name: email
        label: Sign-up email
        type: string
      - name: phone
        label: Phone
        type: string

      # --- Top of the page -----------------------------------------
      - name: kicker
        label: Small line above the title
        type: string
      - name: title
        label: Title
        type: string
      - name: intro
        label: Intro
        type: text
      - name: price
        label: Price
        type: string
      - name: price_note
        label: Price note
        description: What the price covers.
        type: string

      # --- Video and links -----------------------------------------
      - name: video_heading
        label: Video heading
        type: string
      - name: video_intro
        label: Video intro
        type: text
      - name: video_url
        label: YouTube link
        description: Paste a normal YouTube link. Leave empty to hide the video.
        type: string
      - name: video_title
        label: Video title (for screen readers)
        type: string
      - name: links
        label: Links about Jan-Ove
        description: Keep it to about three.
        type: object
        list: true
        fields:
          - name: title
            label: Name
            type: string
          - name: description
            label: Short description
            type: string
          - name: url
            label: Link
            type: string

      # --- Fold-out sections ---------------------------------------
      - name: details_heading
        label: Heading above the fold-out sections
        type: string
      - name: details
        label: Fold-out sections
        description: Blank line = new paragraph. Lines starting with "- " become bullet points. Email addresses and links become clickable.
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
          - name: open
            label: Open by default
            type: boolean
          - name: body
            label: Text
            type: text

      # --- Footer --------------------------------------------------
      - name: footer
        label: Footer text
        type: string
      - name: instagram
        label: Instagram link
        type: string
